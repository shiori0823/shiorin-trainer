<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  html,body{ width:1080px; height:1920px }
  .card{ width:1080px; height:1920px }
  .scrim{ background:
    linear-gradient(180deg, rgba(50,8,14,.94) 0%, rgba(50,8,14,.72) 34%,
                    rgba(50,8,14,.86) 62%, rgba(50,8,14,.97) 100%) }
  .in{ padding:250px 80px 260px }          /* 上下はUIに隠れる安全余白 */
  .when{ display:flex; gap:16px; margin-bottom:54px }
  .when .tag{ font-size:30px; padding:14px 30px; letter-spacing:.02em }
  .when .tag.ghost{ background:transparent; border:3px solid rgba(255,255,255,.5) }
  .hook{ font-size:104px; font-weight:bold; line-height:1.34; letter-spacing:.02em;
    margin-bottom:44px }
  .hook em{ font-style:normal; color:#F0B9C3 }
  .for{ font-size:36px; line-height:1.7; color:#F2E7E9; font-weight:bold;
    padding-left:26px; border-left:8px solid #A02236; margin-bottom:auto }
  .ttl{ margin-bottom:40px }
  .ttl .k{ font-size:30px; font-weight:bold; letter-spacing:.1em; color:#F0B9C3;
    margin-bottom:18px }
  .ttl .t{ font-size:72px; font-weight:bold; line-height:1.3 }
  .ttl .s{ font-size:32px; color:#E8D3D7; margin-top:20px; line-height:1.6 }
  .free{ padding:26px 36px; margin-bottom:34px }
  .free .a{ font-size:30px; letter-spacing:.06em; color:#A0645F; margin-bottom:10px }
  .free .b{ font-size:64px; line-height:1 }
  .free .b s{ font-size:40px; margin-right:18px }
  .free .c{ font-size:30px; margin-top:16px; color:#3B3634 }
  .free .c b{ font-size:38px; color:#7A1524; letter-spacing:.1em }
  .cta{ font-size:38px; font-weight:bold; text-align:center; color:#F0B9C3 }
</style></head><body>
<div class="card">
  <div class="bg"><img src="bg-story.jpg" alt=""></div>
  <div class="scrim"></div>
  <div class="in">
    <div class="when">
      <span class="tag">9/26（土）9:30–11:00</span>
      <span class="tag ghost">Zoom</span>
    </div>
    <p class="hook mincho">3本目が、<br><em>毎回こわい。</em></p>
    <p class="for">練習では挙がるのに、<br>試合で取り切れない<br>パワーリフターへ。</p>
    <div class="ttl">
      <p class="k">90分ワークショップ</p>
      <p class="t mincho">できたのかけら</p>
      <p class="s">気合いでメンタルを強くする話ではありません。<br>その場で手を動かして、次の試合の準備をします。</p>
    </div>
    <div class="free">
      <p class="a">PARTICIPATION FEE</p>
      <p class="b mincho"><s>3,300円</s>無料</p>
      <p class="c">クーポンコード　<b>dekita01</b></p>
    </div>
    <p class="cta">↓ リンクから申し込めます</p>
  </div>
</div>
</body></html>
